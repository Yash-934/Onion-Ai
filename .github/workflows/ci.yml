name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  hygiene-check:
    name: Repository Hygiene & Secret Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify No Secrets or Generated Artifacts Committed
        run: |
          echo "Checking for committed banned artifacts and exposed keys..."
          BANNED=$(git ls-files | grep -E '(\.pyc$|__pycache__|\.pem$|hs_ed25519_secret_key|\.venv|local\.properties)' || true)
          if [ -n "$BANNED" ]; then
            echo "Error: Banned files committed to repository:"
            echo "$BANNED"
            exit 1
          fi
          echo "Hygiene check passed: no banned artifacts or private keys are tracked."

  backend-tests:
    name: Backend Gateway Tests
    needs: hygiene-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Backend Unit & Integration Tests
        run: |
          python -m unittest discover -s server/tests -t server -v

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare Named APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/OnionAI-Debug.apk
          ls -lh build_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnionAI-Debug-APK-CI
          path: build_output/OnionAI-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Add Build Summary
        run: |
          echo "### 🚀 Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`OnionAI-Debug-APK-CI\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`OnionAI-Debug.apk\`" >> $GITHUB_STEP_SUMMARY
